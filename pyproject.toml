[project]
name = "ledgerlens"
version = "0.0.1"
description = "Agentic RAG over European annual reports (ESEF), with numeric answers graded exactly against XBRL tags."
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "Yujie Hu" }]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerlens", "src/ledgerlens_eval"]
