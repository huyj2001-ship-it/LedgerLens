[project]
name = "ledgerlens"
version = "0.0.1"
description = "Agentic RAG over European annual reports (ESEF), with numeric answers graded exactly against XBRL tags."
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Yujie Hu" }]
dependencies = [
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "tenacity>=9.1.4",
    "typer>=0.27.2",
]

[project.scripts]
ledgerlens = "ledgerlens.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerlens", "src/ledgerlens_eval"]

[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]
notebook = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pandas>=3.0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PTH", "RUF", "N"]
ignore = ["E501"]  # line length is handled by the formatter

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib --timeout=60 -m 'not gpu and not contract and not live'"
markers = [
    "gpu: needs a CUDA GPU and downloaded models",
    "contract: calls a real LLM provider (DeepSeek, Ollama, Mistral)",
    "live: calls a real external API (filings.xbrl.org, ECB)",
]
