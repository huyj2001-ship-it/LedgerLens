[project]
name = "ledgerlens"
version = "0.0.1"
description = "Agentic RAG over European annual reports (ESEF), with numeric answers graded exactly against XBRL tags."
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "Yujie Hu" }]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerlens", "src/ledgerlens_eval"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PTH", "RUF", "N"]
ignore = ["E501"]  # line length is handled by the formatter

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
warn_unreachable = true
