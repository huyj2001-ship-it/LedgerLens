[project]
name = "ledgerlens"
version = "0.0.1"
description = "Agentic RAG over European annual reports (ESEF), with numeric answers graded exactly against XBRL tags."
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "Yujie Hu" }]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerlens", "src/ledgerlens_eval"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PTH", "RUF", "N"]
ignore = ["E501"]  # line length is handled by the formatter

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not gpu and not contract and not live'"
markers = [
    "gpu: needs a CUDA GPU and downloaded models",
    "contract: calls a real LLM provider (DeepSeek, Ollama, Mistral)",
    "live: calls a real external API (filings.xbrl.org, ECB)",
]
